<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Incogprio</title>
  </head>
  <body>
    <h3>
      <img src="icon.png" alt="icon" class="title-icon" />
      Incogprio
    </h3>

    <label>
      <input type="checkbox" id="studentToggle" />
      Mask student number (SN)
    </label>

    <label>
      <input type="checkbox" id="toggle"  />
      Mask priority
    </label>

    <input type="text" id="replacement" placeholder="Your priority here" />

    <div class="buttons">
      <button id="save">Save text</button>
      <button id="reset">Reset</button>
    </div>

    <div class="disclaimer">
      You may have to refresh for the changes to take effect.
    </div>

    <div class="credits">
      © 2026 Diogn Lei Mortera (MIT License). All changes are visual and do not
      affect your actual priority (or student number).
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
